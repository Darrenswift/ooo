<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUT OF OFFICE - Security Protocol</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent-pending: #f59e0b;
      --accent-active: #f43f5e;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .container {
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      width: 100%;
      border: 2px solid #334155;
    }

    .status-badge {
      background-color: var(--accent-pending);
      color: white;
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--subtext);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .timer-container {
      display: flex;
      justify-content: space-around;
      margin: 30px 0;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
    }

    .time-box {
      display: flex;
      flex-direction: column;
    }

    .time-box .number {
      font-size: 2.2rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .time-box .label {
      font-size: 0.75rem;
      color: var(--subtext);
      text-transform: uppercase;
    }

    .funny-note {
      background-color: #334155;
      padding: 15px;
      border-radius: 8px;
      font-style: italic;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #7dd3fc;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="status-badge" id="badge">⏳ Standby Mode</span>
    <h1 id="main-title">Out of Office Incoming</h1>
    <p class="subtitle">July 22, 2026 – August 10, 2026</p>

    <div class="funny-note">
      <p id="excuse">Loading cyber protocol...</p>
    </div>

    <h3 id="timer-label">Time Until Disconnect:</h3>
    
    <div class="timer-container">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <button class="btn" onclick="panicAlert()">🚨 Report SOC Emergency</button>
  </div>

  <script>
    // Cyber Security Humor
    const cyberJokes = [
      "Any emails received between July 22 and August 10 will be quarantined as potential phishing attempts.",
      "My inbox is operating under a strict Zero-Trust policy. I don't trust any work messages right now.",
      "Currently revoking my own access tokens until my scheduled return.",
      "If critical security alerts trigger, please try turning the firewall off and on again (don't actually).",
      "Air-gapped isolation mode engaged for personal well-being."
    ];

    document.getElementById('excuse').innerText = `"${cyberJokes[Math.floor(Math.random() * cyberJokes.length)]}"`;

    // Target timestamps
    const startDate = new Date('July 22, 2026 00:00:00').getTime();
    const returnDate = new Date('August 10, 2026 09:00:00').getTime();

    const countdown = setInterval(() => {
      const now = new Date().getTime();

      // PHASE 1: BEFORE July 22 -> Count down TO July 22
      if (now < startDate) {
        document.getElementById('badge').innerText = "⏳ Vacation Countdown";
        document.getElementById('badge').style.backgroundColor = "var(--accent-pending)";
        document.getElementById('main-title').innerText = "Out of Office Starts Soon";
        document.getElementById('timer-label').innerText = "Time Until Access Rights Revoked (July 22):";
        
        const distance = startDate - now;
        updateTimer(distance);
      } 
      // PHASE 2: ON or AFTER July 22, BEFORE August 10 -> Count down TO August 10
      else if (now >= startDate && now < returnDate) {
        document.getElementById('badge').innerText = "🛡️ OOO Protocol Active";
        document.getElementById('badge').style.backgroundColor = "var(--accent-active)";
        document.getElementById('main-title').innerText = "I Am Currently Out of Office";
        document.getElementById('timer-label').innerText = "Time Until Access Rights Restored:";
        
        const distance = returnDate - now;
        updateTimer(distance);
      } 
      // PHASE 3: AFTER August 10 -> Expired / Back in office
      else {
        clearInterval(countdown);
        document.querySelector('.container').innerHTML = "<h1>Authentication Successful!</h1><p>I am back in the office. Triage mode activated for my inbox.</p>";
      }
    }, 1000);

    function updateTimer(distance) {
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    function panicAlert() {
      alert("🚨 SOC INCIDENT RESPONSE:\n\n1. Verify your MFA prompt wasn't a phishing attempt.\n2. Do not click suspicious links.\n3. Escalate to the on-call engineer!\n\n(Have a great day!)");
    }
  </script>
</body>
</html>
