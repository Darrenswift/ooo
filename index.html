<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUT OF OFFICE - Security Protocol Active</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f43f5e;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .container {
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      width: 100%;
      border: 2px solid #334155;
    }

    .status-badge {
      background-color: var(--accent);
      color: white;
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 2.3rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--subtext);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .timer-container {
      display: flex;
      justify-content: space-around;
      margin: 30px 0;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
    }

    .time-box {
      display: flex;
      flex-direction: column;
    }

    .time-box .number {
      font-size: 2.2rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .time-box .label {
      font-size: 0.75rem;
      color: var(--subtext);
      text-transform: uppercase;
    }

    .funny-note {
      background-color: #334155;
      padding: 15px;
      border-radius: 8px;
      font-style: italic;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #7dd3fc;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="status-badge" id="badge">Vacation Pending</span>
    <h1 id="main-title">Out of Office Incoming</h1>
    <p class="subtitle">July 22, 2026 – August 10, 2026</p>

    <div class="funny-note">
      <p id="excuse">Loading cyber protocol...</p>
    </div>

    <h3 id="timer-title">Time Until OOO Starts:</h3>
    
    <div class="timer-container">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <button class="btn" onclick="panicAlert()">🚨 Report SOC Emergency</button>
  </div>

  <script>
    // Cybersecurity-themed humor
    const excuses = [
      "I am currently offline. If critical alerts trigger, please try turning the firewall off and on again (don't actually).",
      "I am away from my desk. Any incoming emails will be quarantined as potential phishing attempts until August 10.",
      "My status is set to Zero-Trust. I don't trust any emails received between July 22 and August 10.",
      "I have temporarily revoked my own access privileges to my inbox. Please contact Level 1 support.",
      "Currently enjoying air-gapped isolation from all work devices."
    ];

    document.getElementById('excuse').innerText = `"${excuses[Math.floor(Math.random() * excuses.length)]}"`;

    // Dates
    const startDate = new Date('July 22, 2026 00:00:00').getTime();
    const returnDate = new Date('August 10, 2026 09:00:00').getTime();

    const countdown = setInterval(() => {
      const now = new Date().getTime();

      // PHASE 1: Before July 22 (Counting down TO vacation)
      if (now < startDate) {
        document.getElementById('badge').innerText = "⏳ Vacation Countdown";
        document.getElementById('main-title').innerText = "Preparing to Disconnect";
        document.getElementById('timer-title').innerText = "Time Until Security Systems Go Offline:";
        
        const distance = startDate - now;
        updateDisplay(distance);
      } 
      // PHASE 2: Between July 22 and Aug 10 (Vacation ACTIVE)
      else if (now >= startDate && now < returnDate) {
        document.getElementById('badge').innerText = "🛡️ Air-Gapped / OOO Active";
        document.getElementById('main-title').innerText = "I Am Currently Out of Office";
        document.getElementById('timer-title').innerText = "Time Until Access Rights Are Restored:";
        
        const distance = returnDate - now;
        updateDisplay(distance);
      } 
      // PHASE 3: After Aug 10
      else {
        clearInterval(countdown);
        document.querySelector('.container').innerHTML = "<h1>Authentication Successful!</h1><p>I am back in the office. Triage mode activated for my inbox.</p>";
      }
    }, 1000);

    function updateDisplay(distance) {
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    function panicAlert() {
      alert("🚨 SOC INCIDENT RESPONSE:\n\n1. Verify your MFA prompt wasn't a phishing attempt.\n2. Do not click suspicious links.\n3. Escalate to the on-call engineer!\n\n(Enjoy your day!)");
    }
  </script>
</body>
</html>
